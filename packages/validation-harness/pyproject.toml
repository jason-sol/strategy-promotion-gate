[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "validation-harness"
version = "0.1.0"
description = "Scipy-free backtest-overfitting validation: deflated Sharpe, CSCV/PBO, and select-then-trade walk-forward"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Solanki" }]
keywords = [
    "backtesting",
    "overfitting",
    "deflated-sharpe",
    "probabilistic-sharpe",
    "cscv",
    "pbo",
    "walk-forward",
    "quantitative-finance",
    "model-selection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
]

[project.urls]
Repository = "https://github.com/jason-sol/strategy-promotion-gate/tree/main/packages/validation-harness"
Issues = "https://github.com/jason-sol/strategy-promotion-gate/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/validation_harness"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "BLE", "DTZ", "FURB", "RUF007", "RUF059", "S102"]
ignore = [
    "I001",  # import order is hand-grouped
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
